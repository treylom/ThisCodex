# ThisCodex install automation contract. Parsed by a strict, dependency-free
# subset reader in scripts/lib/automation-policy.mjs.
schema_version: 2
install:
  default_mode: auto
  browser_tools_required: true
  browser_provider_servers:
    - playwright
    - claude-in-chrome
  handoff_gates:
    - name: host_wsl_install_consent
      surface: host
      flow: init
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: review-wsl-install
      terminal: human_security_gate
      reason_code: host_permission_required
    - name: host_tmux_install_consent
      surface: host
      flow: init
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: review-tmux-install
      terminal: human_security_gate
      reason_code: host_permission_required
    - name: codex_privilege_config_consent
      surface: consent
      flow: setup
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: review-codex-privilege-boundary
      terminal: human_security_gate
      reason_code: security_boundary_review
    - name: codex_hook_trust_approval
      surface: consent
      flow: setup
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: review-codex-hook-trust
      terminal: human_security_gate
      reason_code: security_boundary_review
    - name: shell_profile_persistence
      surface: consent
      flow: setup
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: review-shell-profile-edit
      terminal: human_security_gate
      reason_code: security_boundary_review
    - name: daemon_start_consent
      surface: consent
      flow: init
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: review-daemon-start
      terminal: human_security_gate
      reason_code: security_boundary_review
    - name: superpowers_install_consent
      surface: consent
      flow: init
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: review-superpowers-install
      terminal: human_security_gate
      reason_code: host_permission_required
    - name: github_auth_login
      surface: secret
      flow: init
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: complete-github-login
      terminal: human_security_gate
      reason_code: account_credentials_required
    - name: codex_discord_mcp_config_consent
      surface: consent
      flow: setup
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: review-discord-mcp-config
      terminal: human_security_gate
      reason_code: security_boundary_review
    - name: browser_provider_install_declined
      surface: consent
      flow: browser-provider
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: review-browser-provider-install
      terminal: human_security_gate
      reason_code: operator_declined
    - name: browser_provider_setup
      surface: browser
      flow: browser-provider
      requirement: observed_attempt
      evidence: command
      evidence_tool: provider_setup
      operation: register-restart-redetect-provider
      terminal: tool_failed
      reason_code: provider_not_callable
    - name: browser_provider_ready
      surface: browser
      flow: browser-provider
      requirement: observed_attempt
      evidence: browser
      evidence_tool: browser_inspect
      operation: verify-browser-provider-callable
      terminal: flow_completed
      reason_code: automatic_flow_completed
    - name: discord_portal_login
      surface: browser
      flow: discord-portal
      requirement: named_human
      evidence: browser
      evidence_tool: browser_inspect
      operation: inspect-discord-login
      terminal: human_security_gate
      reason_code: account_credentials_required
    - name: discord_hcaptcha
      surface: browser
      flow: discord-portal
      requirement: named_human
      evidence: browser
      evidence_tool: browser_inspect
      operation: inspect-discord-hcaptcha
      terminal: human_security_gate
      reason_code: captcha_required
    - name: discord_reset_token_modal
      surface: browser
      flow: discord-portal
      requirement: named_human
      evidence: browser
      evidence_tool: browser_inspect
      operation: inspect-discord-token-modal
      terminal: human_security_gate
      reason_code: account_credentials_required
    - name: discord_desktop_approval
      surface: browser
      flow: discord-portal
      requirement: observed_attempt
      evidence: browser
      evidence_tool: browser_action
      operation: approve-discord-desktop-window
      terminal: tool_failed
      reason_code: provider_cannot_control_window
    - name: discord_portal_complete
      surface: browser
      flow: discord-portal
      requirement: observed_attempt
      evidence: browser
      evidence_tool: browser_inspect
      operation: verify-discord-portal-complete
      terminal: flow_completed
      reason_code: automatic_flow_completed
    - name: token_direct_entry
      surface: secret
      flow: discord-portal
      requirement: observed_attempt
      evidence: command
      evidence_tool: clipboard
      operation: model-blind-token-receipt
      terminal: tool_failed
      reason_code: model_blind_channel_unavailable
    - name: slack_browser_login
      surface: browser
      flow: slack-auth
      requirement: named_human
      evidence: browser
      evidence_tool: browser_inspect
      operation: inspect-slack-login
      terminal: human_security_gate
      reason_code: account_credentials_required
    - name: slack_browser_auth
      surface: browser
      flow: slack-auth
      requirement: observed_attempt
      evidence: browser
      evidence_tool: browser_action
      operation: login-ticket-confirm-challenge
      terminal: tool_failed
      reason_code: browser_tool_failed
    - name: slack_browser_auth_complete
      surface: browser
      flow: slack-auth
      requirement: observed_attempt
      evidence: browser
      evidence_tool: browser_inspect
      operation: verify-slack-auth-complete
      terminal: flow_completed
      reason_code: automatic_flow_completed
    - name: slack_workspace_admin_approval
      surface: consent
      flow: slack-app
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: review-slack-workspace-admin
      terminal: human_security_gate
      reason_code: admin_approval_required
    - name: slack_app_reinstall_approval
      surface: consent
      flow: slack-scope
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: review-oauth-scope-grant
      terminal: human_security_gate
      reason_code: admin_approval_required
    - name: slack_native_host_install_consent
      surface: host
      flow: slack-cli
      requirement: named_human
      evidence: none
      evidence_tool: none
      operation: review-slack-native-install
      terminal: human_security_gate
      reason_code: host_permission_required
